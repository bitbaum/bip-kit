name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Re-arm strand: a GITHUB_TOKEN merge does not trigger workflows on its own,
  # so the sweep (or a human) must be able to start CI on main explicitly.
  workflow_dispatch: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # pnpm version comes from "packageManager" in package.json (SSOT);
      # pnpm/action-setup@v6 errors if both are specified.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # build + the full test suite, identical to what runs locally
      - run: pnpm run verify
